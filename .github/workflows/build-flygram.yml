name: Build FlyGram Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Build FlyGram (Windows x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup build directories & MSYS2 junction
        run: |
          mkdir D:\TBuild\Libraries
          mkdir D:\TBuild\ThirdParty
          mklink /j D:\TBuild\ThirdParty\msys64 C:\msys64
          mklink /d D:\TBuild\tdesktop %GITHUB_WORKSPACE%

      - name: Pre-install required MSYS2 packages
        shell: bash
        run: |
          /c/msys64/usr/bin/pacman -S --noconfirm --needed make mingw-w64-x86_64-diffutils mingw-w64-x86_64-gperf mingw-w64-x86_64-nasm mingw-w64-x86_64-perl mingw-w64-x86_64-pkgconf

      - name: Cache Libraries and Tools
        uses: actions/cache@v4
        with:
          path: |
            D:\TBuild\ThirdParty
            !D:\TBuild\ThirdParty\msys64
            D:\TBuild\Libraries
          key: ${{ runner.os }}-flygram-libs-${{ hashFiles('Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            ${{ runner.os }}-flygram-libs-

      - name: Prepare dependencies
        run: |
          cd D:\TBuild\tdesktop\Telegram\build\prepare
          python prepare.py silent

      - name: Configure CMake
        run: |
          cd D:\TBuild\tdesktop\Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -D CMAKE_CONFIGURATION_TYPES=Release

      - name: Build FlyGram
        run: |
          cd D:\TBuild\tdesktop
          cmake --build out --config Release --parallel

      - name: Upload FlyGram.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlyGram-Windows-x64
          path: |
            D:\TBuild\tdesktop\out\Release\FlyGram.exe
            D:\TBuild\tdesktop\out\Release\Telegram.exe
